trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- checkout: self

- script: |
    npx wrangler@latest pages deploy . --project-name=jira-consulting
  displayName: 'Deploy website to Cloudflare Pages'
  env:
    CLOUDFLARE_API_TOKEN: $(CLOUDFLARE_API_TOKEN)
    CLOUDFLARE_ACCOUNT_ID: $(CLOUDFLARE_ACCOUNT_ID)